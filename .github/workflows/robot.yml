name: Robot JEP y Sometimiento

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: robot-jep-sometimiento
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer noticias, fotos y videos del sometimiento y la JEP
        run: node scripts/robot.mjs
      - name: Vista previa con foto real
        run: |
          npm install --no-save --no-package-lock sharp@0.33
          node scripts/og-foto.mjs || true
      - name: Guardar si hay cambios
        run: |
          git config user.name "robot-vibras"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json og-image.jpg og-fuente.txt
          if git diff --staged --quiet; then
            echo "Nada nuevo"
          else
            git commit -m "JEP y Sometimiento $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
